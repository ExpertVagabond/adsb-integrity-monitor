name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Traceability gate (fails if any requirement is unverified)
        run: python -m aim rtm
      - name: Committed RTM matches the code
        run: git diff --exit-code docs/RTM.md
      - name: ReqIF export is current and valid against the OMG schema
        run: |
          python -m aim reqif
          git diff --exit-code docs/requirements.reqif
          command -v xmllint || (sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils)
          curl -sSfL -o /tmp/reqif.xsd https://www.omg.org/spec/ReqIF/20110401/reqif.xsd
          xmllint --noout --schema /tmp/reqif.xsd docs/requirements.reqif
